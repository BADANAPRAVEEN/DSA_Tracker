<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DSA Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>DSA Tracker</h1>

  <!-- Shown when logged out -->
  <div id="auth-section" class="hidden">
    <div class="auth-card">
      <h2>Log in or sign up</h2>
      <div id="auth-message" class="msg"></div>
      <input id="auth-email" type="email" placeholder="Email">
      <input id="auth-password" type="password" placeholder="Password (8 to 64 characters)">
      <div>
        <button id="login-btn">Log in</button>
        <button id="signup-btn" class="secondary">Sign up</button>
      </div>
      <small>New accounts start with 4 sample problems.</small>
    </div>
  </div>

  <!-- Shown when logged in -->
  <div id="app-section" class="hidden">
    <div class="topbar">
      <span id="user-email"></span>
      <button id="logout-btn" class="secondary">Log out</button>
    </div>

    <div id="message" class="msg"></div>

    <div class="form">
      <input id="title" placeholder="Problem title">
      <input id="topic" placeholder="Topic">
      <select id="difficulty">
        <option>Easy</option>
        <option selected>Medium</option>
        <option>Hard</option>
      </select>
      <input id="link" placeholder="Problem link (optional)">
      <input id="notes" placeholder="Notes (optional)">
      <button id="add">Add</button>
    </div>

    <h2>Filters</h2>
    <div class="filters">
      <input id="f-search" placeholder="Search title">
      <input id="f-topic" placeholder="Topic">
      <select id="f-difficulty">
        <option value="">Any difficulty</option>
        <option>Easy</option>
        <option>Medium</option>
        <option>Hard</option>
      </select>
      <select id="f-solved">
        <option value="">Solved or not</option>
        <option value="true">Solved</option>
        <option value="false">Unsolved</option>
      </select>
    </div>

    <ul id="list"></ul>

    <h2>Weak topics</h2>
    <div id="stats"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
